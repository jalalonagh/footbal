<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f2942;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Tactical board -->
  <rect x="80" y="60" width="640" height="380" fill="#1a5c2a" stroke="#2d8a4e" stroke-width="3" rx="12"/>
  <!-- Field lines -->
  <rect x="100" y="80" width="600" height="340" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <line x1="400" y1="80" x2="400" y2="420" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <circle cx="400" cy="250" r="60" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <circle cx="400" cy="250" r="4" fill="rgba(255,255,255,0.5)"/>
  <!-- Tactical arrows -->
  <defs><marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#fbbf24"/></marker></defs>
  <line x1="200" y1="200" x2="300" y2="150" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6,3" marker-end="url(#arr)"/>
  <line x1="200" y1="300" x2="300" y2="350" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6,3" marker-end="url(#arr)"/>
  <line x1="500" y1="250" x2="600" y2="200" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6,3" marker-end="url(#arr)"/>
  <!-- Players with positions -->
  <circle cx="160" cy="250" r="14" fill="#3b82f6" stroke="white" stroke-width="2"/>
  <text x="160" y="255" text-anchor="middle" fill="white" font-size="10" font-weight="bold">GK</text>
  <circle cx="260" cy="150" r="12" fill="#3b82f6" stroke="white" stroke-width="2"/>
  <text x="260" y="155" text-anchor="middle" fill="white" font-size="9" font-weight="bold">CB</text>
  <circle cx="260" cy="350" r="12" fill="#3b82f6" stroke="white" stroke-width="2"/>
  <text x="260" y="355" text-anchor="middle" fill="white" font-size="9" font-weight="bold">LB</text>
  <circle cx="380" cy="200" r="12" fill="#3b82f6" stroke="white" stroke-width="2"/>
  <text x="380" y="205" text-anchor="middle" fill="white" font-size="9" font-weight="bold">CM</text>
  <circle cx="380" cy="300" r="12" fill="#3b82f6" stroke="white" stroke-width="2"/>
  <text x="380" y="305" text-anchor="middle" fill="white" font-size="9" font-weight="bold">CM</text>
  <circle cx="520" cy="180" r="12" fill="#3b82f6" stroke="white" stroke-width="2"/>
  <text x="520" y="185" text-anchor="middle" fill="white" font-size="9" font-weight="bold">RW</text>
  <circle cx="520" cy="320" r="12" fill="#3b82f6" stroke="white" stroke-width="2"/>
  <text x="520" y="325" text-anchor="middle" fill="white" font-size="9" font-weight="bold">LW</text>
  <circle cx="620" cy="250" r="12" fill="#3b82f6" stroke="white" stroke-width="2"/>
  <text x="620" y="255" text-anchor="middle" fill="white" font-size="9" font-weight="bold">ST</text>
  <!-- Coaching notes -->
  <rect x="100" y="440" width="200" height="30" fill="rgba(255,255,255,0.1)" rx="6"/>
  <text x="110" y="460" fill="rgba(255,255,255,0.6)" font-size="11">Pressing triggers...</text>
  <rect x="320" y="440" width="160" height="30" fill="rgba(255,255,255,0.1)" rx="6"/>
  <text x="330" y="460" fill="rgba(255,255,255,0.6)" font-size="11">High line defense</text>
</svg>

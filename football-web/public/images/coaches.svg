<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#065f46;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#064e3b;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg2)" rx="16"/>
  <!-- Clipboard -->
  <rect x="140" y="40" width="120" height="160" rx="8" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <rect x="170" y="30" width="60" height="20" rx="4" fill="rgba(255,255,255,0.2)"/>
  <!-- Lines on clipboard -->
  <line x1="155" y1="80" x2="245" y2="80" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <line x1="155" y1="100" x2="225" y2="100" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <line x1="155" y1="120" x2="235" y2="120" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <line x1="155" y1="140" x2="215" y2="140" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <line x1="155" y1="160" x2="240" y2="160" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <!-- Whistle -->
  <circle cx="300" cy="100" r="20" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="3"/>
  <line x1="300" y1="120" x2="300" y2="160" stroke="rgba(255,255,255,0.3)" stroke-width="3"/>
  <circle cx="300" cy="165" r="8" fill="rgba(255,255,255,0.2)"/>
  <!-- Tactical diagram -->
  <circle cx="100" cy="220" r="10" fill="rgba(255,255,255,0.2)"/>
  <circle cx="140" cy="200" r="10" fill="rgba(255,255,255,0.2)"/>
  <circle cx="140" cy="250" r="10" fill="rgba(255,255,255,0.2)"/>
  <circle cx="200" cy="230" r="10" fill="rgba(255,255,255,0.2)"/>
  <defs><marker id="a2" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="rgba(255,255,255,0.3)"/></marker></defs>
  <line x1="110" y1="220" x2="130" y2="205" stroke="rgba(255,255,255,0.3)" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="150" y1="245" x2="190" y2="235" stroke="rgba(255,255,255,0.3)" stroke-width="2" marker-end="url(#a2)"/>
  <!-- Text -->
  <text x="200" y="285" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="16" font-weight="bold">COACHES &amp; MANAGERS</text>
</svg>

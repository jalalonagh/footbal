<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#065f46;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#064e3b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#15803d;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <!-- Field lines -->
  <rect x="100" y="80" width="1000" height="440" fill="url(#grass)" stroke="rgba(255,255,255,0.2)" stroke-width="2" rx="8"/>
  <line x1="600" y1="80" x2="600" y2="520" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <circle cx="600" cy="300" r="80" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <circle cx="600" cy="300" r="4" fill="rgba(255,255,255,0.3)"/>
  <!-- Penalty areas -->
  <rect x="100" y="180" width="160" height="240" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <rect x="940" y="180" width="160" height="240" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <!-- Players - Team 1 -->
  <circle cx="220" cy="300" r="18" fill="#3b82f6" stroke="white" stroke-width="2"/>
  <text x="220" y="305" text-anchor="middle" fill="white" font-size="12" font-weight="bold">1</text>
  <circle cx="320" cy="180" r="16" fill="#3b82f6" stroke="white" stroke-width="2"/>
  <text x="320" y="185" text-anchor="middle" fill="white" font-size="11" font-weight="bold">4</text>
  <circle cx="320" cy="420" r="16" fill="#3b82f6" stroke="white" stroke-width="2"/>
  <text x="320" y="425" text-anchor="middle" fill="white" font-size="11" font-weight="bold">3</text>
  <circle cx="440" cy="250" r="16" fill="#3b82f6" stroke="white" stroke-width="2"/>
  <text x="440" y="255" text-anchor="middle" fill="white" font-size="11" font-weight="bold">6</text>
  <circle cx="440" cy="350" r="16" fill="#3b82f6" stroke="white" stroke-width="2"/>
  <text x="440" y="355" text-anchor="middle" fill="white" font-size="11" font-weight="bold">8</text>
  <!-- Players - Team 2 -->
  <circle cx="980" cy="300" r="18" fill="#ef4444" stroke="white" stroke-width="2"/>
  <text x="980" y="305" text-anchor="middle" fill="white" font-size="12" font-weight="bold">1</text>
  <circle cx="880" cy="200" r="16" fill="#ef4444" stroke="white" stroke-width="2"/>
  <text x="880" y="205" text-anchor="middle" fill="white" font-size="11" font-weight="bold">5</text>
  <circle cx="880" cy="400" r="16" fill="#ef4444" stroke="white" stroke-width="2"/>
  <text x="880" y="405" text-anchor="middle" fill="white" font-size="11" font-weight="bold">2</text>
  <!-- Ball -->
  <circle cx="560" cy="300" r="8" fill="white" stroke="#333" stroke-width="1.5"/>
  <!-- Arrow -->
  <defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="rgba(255,255,255,0.5)"/></marker></defs>
  <line x1="560" y1="300" x2="620" y2="260" stroke="rgba(255,255,255,0.4)" stroke-width="3" marker-end="url(#arrowhead)"/>
</svg>

version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: FootballTacticalTraining.API/Dockerfile
    ports:
      - "5144:5144"
    depends_on:
      - sqlserver
      - redis
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=FootballTacticalTraining;User=sa;Password=YourStrong@Password123;TrustServerCertificate=True
      - ConnectionStrings__Redis=redis:6379
      - Jwt__Key=YourSuperSecretKeyHereMustBe32CharactersLong!!
      - Jwt__Issuer=FootballTacticalTraining
      - Jwt__Audience=FootballTacticalTrainingWeb
      - Jwt__ExpiryHours=24
      - ZarinPal__MerchantId=
      - ZarinPal__IsSandbox=true
      - Cors__Origins=http://localhost:3000

  web:
    build:
      context: ./football-web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5144/api

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Password123
    volumes:
      - sqldata:/var/opt/mssql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  sqldata:
